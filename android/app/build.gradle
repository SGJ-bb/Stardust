plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.aicompanion'
    compileSdk 34
    buildDir = file("build_v3")

    defaultConfig {
        applicationId "com.aicompanion"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        // 启用 Compose Strong Skipping Mode：含不稳定参数（lambda）的 Composable 也可跳过重组
        freeCompilerArgs += ["-P", "plugin:androidx.compose.compiler.plugins.kotlin:strongSkipping=true"]
    }

    buildFeatures {
        viewBinding true
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.14'
    }

    androidResources {
        noCompress 'moc3', 'moc', 'tflite', 'onnx'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.14.0'
    implementation 'com.google.mlkit:text-recognition:16.0.0'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.0'

    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.0'

    implementation 'com.google.zxing:core:3.5.2'

    // Live2D Cubism SDK - 需要手动下载aar文件放入libs目录
    // implementation files('libs/live2d.aar')

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // === Compose BOM (锁定所有 Compose 库版本) ===
    implementation platform('androidx.compose:compose-bom:2024.06.00')

    // Compose 核心
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.runtime:runtime-livedata'

    // 导航
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // ViewModel 集成
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'

    // Activity Compose
    implementation 'androidx.activity:activity-compose:1.9.0'

    // 图片加载
    implementation 'io.coil-kt:coil-compose:2.6.0'

    // ConstraintLayout Compose
    implementation 'androidx.constraintlayout:constraintlayout-compose:1.0.1'

    // Debug 工具（仅在 debug）
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
