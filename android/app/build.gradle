plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.aicompanion'
    compileSdk 34
    buildDir = file("build_v3")

    // JVM 单测里 android.util.Log 等是空壳，会抛 "not mocked"。
    // 纯逻辑类（坐标解析、SPAKE 数学）不该为此被挡住，所以让桩方法返回默认值。
    testOptions {
        unitTests.returnDefaultValues = true
    }

    // 三个 BouncyCastle jar 都带多版本 META-INF，打包会重名冲突
    packagingOptions {
        resources {
            excludes += [
                'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
                'META-INF/OSGI-INF/MANIFEST.MF',
                'META-INF/versions/9/module-info.class',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE*'
            ]
        }
    }

    defaultConfig {
        applicationId "com.aicompanion"
        minSdk 23
        targetSdk 34
        versionCode 4
        versionName "1.2.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        // 启用 Compose Strong Skipping Mode：含不稳定参数（lambda）的 Composable 也可跳过重组
        freeCompilerArgs += ["-P", "plugin:androidx.compose.compiler.plugins.kotlin:strongSkipping=true"]
    }

    buildFeatures {
        viewBinding true
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.14'
    }

    androidResources {
        noCompress 'moc3', 'moc', 'tflite', 'onnx'
    }

    packaging {
        jniLibs {
            // sherpa-onnx 自带的 lib-onnx 与 onnxruntime-android 都提供 libonnxruntime.so，
            // 且是两套不同的构建；这里保留 sherpa 那份（合并顺序里 lib-onnx 在前），
            // 否则 libsherpa-onnx-jni.so 会报 cannot locate symbol "OrtGetApiBase"。
            pickFirsts += ['lib/**/libonnxruntime.so']
        }
    }
}

dependencies {
    // 配对需要 TLS 1.3 + RFC5705 导出密钥（JSSE 标准 API 取不到）
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'org.bouncycastle:bctls-jdk18on:1.78.1'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.14.0'
    implementation 'com.google.mlkit:text-recognition:16.0.0'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.0'

    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.0'

    // 语音唤醒（离线关键词检测）：sherpa-onnx JNI + 中文 KWS 模型（模型以 assets 形式合并进 APK）
    // 注意：sherpa 的 JNI 必须配它自带的 libonnxruntime.so（和 onnxruntime-android 那份是两套构建，
    // 大小与导出符号都不同，用错会 dlopen 时报 cannot locate symbol "OrtGetApiBase"）。
    // 两份同名 .so 的冲突用 pickFirsts 解决，实际留下的是 sherpa 的 lib-onnx（合并时排在前面）。
    implementation 'com.bihe0832.android:lib-sherpa-onnx:6.25.21'
    implementation 'com.bihe0832.android:lib-sherpa-kws-model:6.16.7'

    // Shizuku：免 root 拿 ADB（shell UID）级权限，用于 input/settings/screencap/pm 等
    implementation 'dev.rikka.shizuku:api:12.2.0'
    implementation 'dev.rikka.shizuku:provider:12.2.0'

    implementation 'com.google.zxing:core:3.5.2'

    // Live2D Cubism SDK - 需要手动下载aar文件放入libs目录
    // implementation files('libs/live2d.aar')

    testImplementation 'junit:junit:4.13.2'
    // JVM 单测里 org.json 是空壳（Android SDK 的 stub），补一份真实实现
    testImplementation 'org.json:json:20231013'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // === Compose BOM (锁定所有 Compose 库版本) ===
    implementation platform('androidx.compose:compose-bom:2024.06.00')

    // Compose 核心
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.runtime:runtime-livedata'

    // 导航
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // ViewModel 集成
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'

    // Activity Compose
    implementation 'androidx.activity:activity-compose:1.9.0'

    // 图片加载
    implementation 'io.coil-kt:coil-compose:2.6.0'

    // ConstraintLayout Compose
    implementation 'androidx.constraintlayout:constraintlayout-compose:1.0.1'

    // Debug 工具（仅在 debug）
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
