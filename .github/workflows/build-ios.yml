name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "构建类型"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "stradust-ios/src-tauri -> target"

      - name: Install frontend dependencies
        working-directory: stradust-ios
        run: pnpm install

      - name: Initialize Tauri iOS
        working-directory: stradust-ios
        run: |
          if [ ! -d "src-tauri/gen/apple" ]; then
            # 设置临时 Team ID 用于初始化（debug 构建不需要真实签名）
            # 如果有 APPLE_DEVELOPMENT_TEAM secret 则使用，否则用占位符
            TEAM_ID="${{ secrets.APPLE_DEVELOPMENT_TEAM }}"
            if [ -z "$TEAM_ID" ]; then
              TEAM_ID="0000000000"
            fi
            # 更新 tauri.conf.json 中的 developmentTeam
            cd src-tauri
            python3 -c "
            import json
            with open('tauri.conf.json', 'r') as f:
                    cfg = json.load(f)
            cfg['bundle']['iOS']['developmentTeam'] = '$TEAM_ID'
            with open('tauri.conf.json', 'w') as f:
                    json.dump(cfg, f, indent=2, ensure_ascii=False)
            "
            cd ..
            pnpm tauri ios init --ci
          fi

      - name: Build iOS (Debug - no signing)
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == '' }}
        working-directory: stradust-ios
        run: |
          # Debug 构建：使用 xcodebuild 直接构建，跳过签名
          cd src-tauri
          # 找到 Xcode 项目
          XCPROJECT=$(find gen/apple -name "*.xcodeproj" -maxdepth 1 -type d | head -1)
          if [ -z "$XCPROJECT" ]; then
            echo "ERROR: 未找到 Xcode 项目"
            exit 1
          fi
          PROJECT_NAME=$(basename "$XCPROJECT" .xcodeproj)
          echo "Xcode 项目: $PROJECT_NAME"

          # 使用 xcodebuild 构建，跳过签名
          xcodebuild \
            -project "gen/apple/$PROJECT_NAME.xcodeproj" \
            -scheme "$PROJECT_NAME" \
            -sdk iphoneos \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "gen/apple/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tail -20

      - name: Build iOS (Release - with signing)
        if: ${{ github.event.inputs.build_type == 'release' }}
        working-directory: stradust-ios
        run: |
          # Release 构建需要 Apple Developer 证书
          if [ -z "${{ secrets.APPLE_DEVELOPMENT_TEAM }}" ]; then
            echo "ERROR: Release 构建需要配置 APPLE_DEVELOPMENT_TEAM secret"
            echo "请在 GitHub 仓库 Settings > Secrets 中添加以下密钥："
            echo "  - APPLE_DEVELOPMENT_TEAM: Apple Developer Team ID"
            echo "  - APPLE_CERTIFICATE: Base64 编码的 P12 证书"
            echo "  - APPLE_CERTIFICATE_PASSWORD: P12 证书密码"
            echo "  - APPLE_PROVISIONING_PROFILE: Base64 编码的描述文件"
            exit 1
          fi
          pnpm tauri ios build

      - name: Find and prepare IPA
        working-directory: stradust-ios
        run: |
          echo "=== 查找构建产物 ==="
          find src-tauri -name "*.app" -type d 2>/dev/null || true

          # 创建输出目录
          mkdir -p output

          # 查找 .app 文件
          APP_PATH=$(find src-tauri -name "*.app" -path "*/Debug-iphoneos/*" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find src-tauri -name "*.app" -path "*/Release-iphoneos/*" -type d 2>/dev/null | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find src-tauri -name "*.app" -path "*-iphoneos/*" -type d 2>/dev/null | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find src-tauri -name "*.app" -path "*/build/*" -type d 2>/dev/null | head -1)
          fi

          if [ -n "$APP_PATH" ]; then
            echo "找到 APP: $APP_PATH"
            mkdir -p output/Payload
            cp -r "$APP_PATH" output/Payload/
            cd output
            zip -r "../stradust-ios.ipa" Payload
            cd ..
            echo "IPA 创建成功"
            ls -lh stradust-ios.ipa
          else
            echo "ERROR: 未找到任何 .app 构建产物"
            echo "=== 列出所有构建产物 ==="
            find src-tauri -name "*.app" -type d 2>/dev/null || echo "无 .app 文件"
            find src-tauri/gen/apple -type d -maxdepth 5 2>/dev/null | head -30
            exit 1
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: stradust-ios-${{ github.event.inputs.build_type || 'debug' }}
          path: stradust-ios/stradust-ios.ipa
          retention-days: 30

      - name: Build summary
        run: |
          echo "## 构建结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **构建类型**: ${{ github.event.inputs.build_type || 'debug' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **签名**: Debug 模式跳过签名（需 AltStore/Sideloadly 安装）" >> $GITHUB_STEP_SUMMARY
          echo "- **产物**: stradust-ios.ipa" >> $GITHUB_STEP_SUMMARY
          echo "- **下载**: 在 Artifacts 中下载" >> $GITHUB_STEP_SUMMARY
