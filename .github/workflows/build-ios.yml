name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "构建类型"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "stradust-ios/src-tauri -> target"

      - name: Install frontend dependencies
        working-directory: stradust-ios
        run: pnpm install

      - name: Initialize Tauri iOS
        working-directory: stradust-ios
        run: |
          # 设置 Team ID
          TEAM_ID="${{ secrets.APPLE_DEVELOPMENT_TEAM }}"
          if [ -z "$TEAM_ID" ]; then
            TEAM_ID="0000000000"
          fi

          # 更新 tauri.conf.json 中的 developmentTeam
          cd src-tauri
          python3 -c "
          import json
          with open('tauri.conf.json', 'r') as f:
              cfg = json.load(f)
          cfg['bundle']['iOS']['developmentTeam'] = '$TEAM_ID'
          with open('tauri.conf.json', 'w') as f:
              json.dump(cfg, f, indent=2, ensure_ascii=False)
          "
          cd ..

          # 初始化 iOS 项目
          if [ ! -d "src-tauri/gen/apple" ]; then
            pnpm tauri ios init --ci
          fi

      - name: Disable code signing in Xcode project
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == '' }}
        working-directory: stradust-ios
        run: |
          PBXPROJ="src-tauri/gen/apple/stradust-ios.xcodeproj/project.pbxproj"
          if [ ! -f "$PBXPROJ" ]; then
            echo "ERROR: project.pbxproj not found"
            ls -la src-tauri/gen/apple/ 2>/dev/null || true
            exit 1
          fi

          echo "=== 原始签名配置 ==="
          grep -n "CODE_SIGN" "$PBXPROJ" | head -20
          grep -n "DEVELOPMENT_TEAM" "$PBXPROJ" | head -10
          grep -n "PROVISIONING_PROFILE" "$PBXPROJ" | head -10

          echo "=== 修改 Xcode 项目签名配置 ==="

          # 将 CODE_SIGN_STYLE 从 Automatic 改为 Manual
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ"

          # 将所有 CODE_SIGN_IDENTITY 改为空
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development"/CODE_SIGN_IDENTITY = "";/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer"/CODE_SIGN_IDENTITY = "";/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_IDENTITY = "iOS Developer"/CODE_SIGN_IDENTITY = "";/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Distribution"/CODE_SIGN_IDENTITY = "";/g' "$PBXPROJ"

          # 清空 DEVELOPMENT_TEAM
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Za-z0-9]*;/DEVELOPMENT_TEAM = "";/g' "$PBXPROJ"

          # 清空 PROVISIONING_PROFILE_SPECIFIER
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = ".*";/PROVISIONING_PROFILE_SPECIFIER = "";/g' "$PBXPROJ"
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = [A-Za-z0-9_.]*;/PROVISIONING_PROFILE_SPECIFIER = "";/g' "$PBXPROJ"

          # 使用 python3 在每个 buildSettings 块中注入签名禁用设置
          python3 << 'PYEOF'
          import re, sys

          pbxproj = "src-tauri/gen/apple/stradust-ios.xcodeproj/project.pbxproj"
          with open(pbxproj, 'r') as f:
              content = f.read()

          # 在每个包含 CODE_SIGN_STYLE = Manual 的 buildSettings 块中
          # 添加 CODE_SIGNING_ALLOWED = NO 和 CODE_SIGNING_REQUIRED = NO
          lines_to_add = [
              'CODE_SIGN_IDENTITY = ""',
              'CODE_SIGNING_ALLOWED = NO',
              'CODE_SIGNING_REQUIRED = NO',
              'PROVISIONING_PROFILE_SPECIFIER = ""',
          ]

          # 找到所有 buildSettings 块并注入
          new_lines = []
          in_build_settings = False
          has_signing_allowed = False

          for line in content.split('\n'):
              new_lines.append(line)
              if 'buildSettings = {' in line:
                  in_build_settings = True
                  has_signing_allowed = False
              elif in_build_settings and 'CODE_SIGNING_ALLOWED' in line:
                  has_signing_allowed = True
              elif in_build_settings and '};' in line and not has_signing_allowed:
                  # 在 buildSettings 块结束前插入
                  indent = '\t\t\t\t'
                  for add_line in lines_to_add:
                      new_lines.append(f'{indent}{add_line};')
                  in_build_settings = False
              elif '};' in line:
                  in_build_settings = False

          with open(pbxproj, 'w') as f:
              f.write('\n'.join(new_lines))

          print(f"注入完成")
          PYEOF

          echo "=== 修改后签名配置 ==="
          grep -n "CODE_SIGN" "$PBXPROJ" | head -30
          grep -n "DEVELOPMENT_TEAM" "$PBXPROJ" | head -10

      - name: Build iOS (Debug - no signing)
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == '' }}
        working-directory: stradust-ios
        run: |
          # 使用 tauri ios build（它会处理 Rust 编译 + 前端构建 + xcodebuild）
          # 但通过环境变量和 pbxproj 修改跳过签名
          pnpm tauri ios build --debug 2>&1 | tee build.log || {
            echo "=== 构建失败 ==="
            tail -200 build.log
            exit 1
          }

      - name: Build iOS (Release - with signing)
        if: ${{ github.event.inputs.build_type == 'release' }}
        working-directory: stradust-ios
        run: |
          if [ -z "${{ secrets.APPLE_DEVELOPMENT_TEAM }}" ]; then
            echo "ERROR: Release 构建需要配置 APPLE_DEVELOPMENT_TEAM secret"
            exit 1
          fi
          pnpm tauri ios build

      - name: Find and prepare IPA
        working-directory: stradust-ios
        run: |
          echo "=== 查找构建产物 ==="

          # 搜索所有可能的 .app 位置
          echo "--- 项目目录 ---"
          find . -name "*.app" -type d 2>/dev/null || true

          echo "--- Xcode DerivedData ---"
          find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d -maxdepth 8 2>/dev/null | head -20 || true

          mkdir -p output

          APP_PATH=""

          # 方法1: 在项目目录查找
          for pattern in \
            "*/Debug-iphoneos/*.app" \
            "*/Release-iphoneos/*.app" \
            "*-iphoneos/*.app" \
            "*/Build/Products/*/*.app"; do
            APP_PATH=$(find . -path "$pattern" -type d 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ]; then
              echo "方法1找到: $APP_PATH"
              break
            fi
          done

          # 方法2: 在 DerivedData 查找
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -path "*-iphoneos/*" -type d 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ]; then
              echo "方法2找到: $APP_PATH"
            fi
          fi

          # 方法3: 在 target 目录查找 (Rust 交叉编译产物)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find src-tauri/target -name "*.app" -type d -maxdepth 5 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ]; then
              echo "方法3找到: $APP_PATH"
            fi
          fi

          if [ -n "$APP_PATH" ]; then
            echo "找到 APP: $APP_PATH"
            mkdir -p output/Payload
            cp -r "$APP_PATH" output/Payload/
            cd output
            zip -r "../stradust-ios.ipa" Payload
            cd ..
            echo "IPA 创建成功"
            ls -lh stradust-ios.ipa
          else
            echo "ERROR: 未找到 .app 构建产物"
            echo "=== 完整目录结构 ==="
            find src-tauri -type d -maxdepth 8 2>/dev/null | head -80
            echo "=== DerivedData ==="
            find ~/Library/Developer/Xcode/DerivedData -type d -maxdepth 6 2>/dev/null | head -50
            exit 1
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: stradust-ios-${{ github.event.inputs.build_type || 'debug' }}
          path: stradust-ios/stradust-ios.ipa
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          echo "## 构建结果" >> $GITHUB_STEP_SUMMARY
          echo "- **构建类型**: ${{ github.event.inputs.build_type || 'debug' }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.build_type || 'debug' }}" = "debug" ]; then
            echo "- **签名**: 跳过签名（需 AltStore/Sideloadly 安装）" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **签名**: Apple Developer 签名" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **产物**: stradust-ios.ipa" >> $GITHUB_STEP_SUMMARY
