name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "构建类型"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "stradust-ios/src-tauri -> target"

      - name: Install frontend dependencies
        working-directory: stradust-ios
        run: pnpm install

      - name: Initialize Tauri iOS
        working-directory: stradust-ios
        run: |
          # 设置 Team ID（占位符或真实值）
          TEAM_ID="${{ secrets.APPLE_DEVELOPMENT_TEAM }}"
          if [ -z "$TEAM_ID" ]; then
            TEAM_ID="0000000000"
          fi

          # 用 python3 更新 tauri.conf.json 中的 developmentTeam
          cd src-tauri
          python3 -c "
          import json
          with open('tauri.conf.json', 'r') as f:
              cfg = json.load(f)
          cfg['bundle']['iOS']['developmentTeam'] = '$TEAM_ID'
          with open('tauri.conf.json', 'w') as f:
              json.dump(cfg, f, indent=2, ensure_ascii=False)
          "
          cd ..

          # 初始化 iOS 项目（如果尚未初始化）
          if [ ! -d "src-tauri/gen/apple" ]; then
            pnpm tauri ios init --ci
          fi

      - name: Build iOS (Debug - no signing)
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == '' }}
        working-directory: stradust-ios
        env:
          CODE_SIGN_IDENTITY: ""
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"
        run: pnpm tauri ios build --debug

      - name: Build iOS (Release - with signing)
        if: ${{ github.event.inputs.build_type == 'release' }}
        working-directory: stradust-ios
        run: |
          if [ -z "${{ secrets.APPLE_DEVELOPMENT_TEAM }}" ]; then
            echo "ERROR: Release 构建需要配置 APPLE_DEVELOPMENT_TEAM secret"
            exit 1
          fi
          pnpm tauri ios build

      - name: Find and prepare IPA
        working-directory: stradust-ios
        run: |
          echo "=== 查找构建产物 ==="
          find src-tauri -name "*.app" -type d 2>/dev/null || true

          mkdir -p output

          # 多种路径模式查找 .app
          APP_PATH=""
          for pattern in \
            "*/Debug-iphoneos/*.app" \
            "*/Release-iphoneos/*.app" \
            "*-iphoneos/*.app" \
            "*/build/Build/Products/Debug-iphoneos/*.app" \
            "*/build/Build/Products/Release-iphoneos/*.app"; do
            APP_PATH=$(find src-tauri -path "$pattern" -type d 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ]; then
              break
            fi
          done

          if [ -n "$APP_PATH" ]; then
            echo "找到 APP: $APP_PATH"
            mkdir -p output/Payload
            cp -r "$APP_PATH" output/Payload/
            cd output
            zip -r "../stradust-ios.ipa" Payload
            cd ..
            echo "IPA 创建成功"
            ls -lh stradust-ios.ipa
          else
            echo "ERROR: 未找到 .app 构建产物"
            echo "=== 详细目录结构 ==="
            find src-tauri/gen/apple/build -type d -maxdepth 6 2>/dev/null | head -50
            find src-tauri/target -name "*.app" -type d -maxdepth 8 2>/dev/null | head -20
            exit 1
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: stradust-ios-${{ github.event.inputs.build_type || 'debug' }}
          path: stradust-ios/stradust-ios.ipa
          retention-days: 30

      - name: Build summary
        run: |
          echo "## 构建结果" >> $GITHUB_STEP_SUMMARY
          echo "- **构建类型**: ${{ github.event.inputs.build_type || 'debug' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **签名**: Debug 模式跳过签名（需 AltStore/Sideloadly 安装）" >> $GITHUB_STEP_SUMMARY
          echo "- **产物**: stradust-ios.ipa" >> $GITHUB_STEP_SUMMARY
