name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "构建类型"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "stradust-ios/src-tauri -> target"

      - name: Install frontend dependencies
        working-directory: stradust-ios
        run: pnpm install

      - name: Initialize Tauri iOS
        working-directory: stradust-ios
        run: |
          # 设置 Team ID
          TEAM_ID="${{ secrets.APPLE_DEVELOPMENT_TEAM }}"
          if [ -z "$TEAM_ID" ]; then
            TEAM_ID="0000000000"
          fi

          # 更新 tauri.conf.json 中的 developmentTeam
          cd src-tauri
          python3 -c "
          import json
          with open('tauri.conf.json', 'r') as f:
              cfg = json.load(f)
          cfg['bundle']['iOS']['developmentTeam'] = '$TEAM_ID'
          with open('tauri.conf.json', 'w') as f:
              json.dump(cfg, f, indent=2, ensure_ascii=False)
          "
          cd ..

          # 初始化 iOS 项目
          if [ ! -d "src-tauri/gen/apple" ]; then
            pnpm tauri ios init --ci
          fi

      - name: Disable code signing in Xcode project
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == '' }}
        working-directory: stradust-ios
        run: |
          PBXPROJ="src-tauri/gen/apple/stradust-ios.xcodeproj/project.pbxproj"
          if [ ! -f "$PBXPROJ" ]; then
            echo "ERROR: project.pbxproj not found"
            exit 1
          fi

          echo "=== 修改 Xcode 项目签名配置 ==="

          # 将 CODE_SIGN_STYLE 从 Automatic 改为 Manual
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ"

          # 将 CODE_SIGN_IDENTITY 改为空（禁用签名）
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development"/CODE_SIGN_IDENTITY = "";/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer"/CODE_SIGN_IDENTITY = "";/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_IDENTITY = "iOS Developer"/CODE_SIGN_IDENTITY = "";/g' "$PBXPROJ"

          # 清空 PROVISIONING_PROFILE_SPECIFIER
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = "".*/PROVISIONING_PROFILE_SPECIFIER = "";/g' "$PBXPROJ"

          # 清空 DEVELOPMENT_TEAM（如果用占位符）
          sed -i '' 's/DEVELOPMENT_TEAM = 0000000000;/DEVELOPMENT_TEAM = "";/g' "$PBXPROJ"

          # 添加 CODE_SIGNING_ALLOWED = NO 到所有 Debug 配置
          # 使用 python3 精确修改
          python3 -c "
          import re
          with open('$PBXPROJ', 'r') as f:
              content = f.read()

          # 在每个 buildSettings 块中添加签名禁用设置
          # 查找 Debug 配置块并添加
          content = re.sub(
              r'(buildSettings = \{[^}]*CODE_SIGN_STYLE = Manual;)',
              r'\1\n\t\t\t\tCODE_SIGN_IDENTITY = \"\";\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"\";',
              content
          )

          with open('$PBXPROJ', 'w') as f:
              f.write(content)
          "

          echo "=== 验证修改结果 ==="
          grep -c "CODE_SIGNING_ALLOWED = NO" "$PBXPROJ" || echo "WARNING: CODE_SIGNING_ALLOWED not found"
          grep -c "CODE_SIGN_STYLE = Manual" "$PBXPROJ" || echo "WARNING: CODE_SIGN_STYLE not found"

      - name: Build iOS (Debug - no signing)
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == '' }}
        working-directory: stradust-ios
        run: |
          # 使用 xcodebuild 直接构建，完全控制签名参数
          cd src-tauri

          # 先构建前端
          cd ..
          pnpm vite build
          cd src-tauri

          # 使用 xcodebuild 构建，跳过所有签名
          xcodebuild \
            -project gen/apple/stradust-ios.xcodeproj \
            -scheme stradust-ios_iOS \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath ../build/stradust-ios.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build \
            2>&1 | tee ../build.log || {
              echo "=== 构建失败，查看日志 ==="
              tail -100 ../build.log
              exit 1
            }

      - name: Build iOS (Release - with signing)
        if: ${{ github.event.inputs.build_type == 'release' }}
        working-directory: stradust-ios
        run: |
          if [ -z "${{ secrets.APPLE_DEVELOPMENT_TEAM }}" ]; then
            echo "ERROR: Release 构建需要配置 APPLE_DEVELOPMENT_TEAM secret"
            exit 1
          fi
          pnpm tauri ios build

      - name: Find and prepare IPA
        working-directory: stradust-ios
        run: |
          echo "=== 查找构建产物 ==="
          find . -name "*.app" -type d 2>/dev/null || true
          find . -name "*.xcarchive" -type d 2>/dev/null || true

          mkdir -p output

          # 方法1: 从 xcarchive 提取 .app
          APP_PATH=""
          ARCHIVE_PATH=$(find . -name "*.xcarchive" -type d 2>/dev/null | head -1)
          if [ -n "$ARCHIVE_PATH" ]; then
            APP_PATH=$(find "$ARCHIVE_PATH" -name "*.app" -type d 2>/dev/null | head -1)
          fi

          # 方法2: 直接查找 .app
          if [ -z "$APP_PATH" ]; then
            for pattern in \
              "*/Debug-iphoneos/*.app" \
              "*/Release-iphoneos/*.app" \
              "*-iphoneos/*.app" \
              "*/Products/Debug-iphoneos/*.app" \
              "*/Products/Release-iphoneos/*.app"; do
              APP_PATH=$(find . -path "$pattern" -type d 2>/dev/null | head -1)
              if [ -n "$APP_PATH" ]; then
                break
              fi
            done
          fi

          # 方法3: 从 DerivedData 查找
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -path "*/Debug-iphoneos/*" -type d 2>/dev/null | head -1)
          fi

          if [ -n "$APP_PATH" ]; then
            echo "找到 APP: $APP_PATH"
            mkdir -p output/Payload
            cp -r "$APP_PATH" output/Payload/
            cd output
            zip -r "../stradust-ios.ipa" Payload
            cd ..
            echo "IPA 创建成功"
            ls -lh stradust-ios.ipa
          else
            echo "ERROR: 未找到 .app 构建产物"
            echo "=== 详细目录结构 ==="
            find src-tauri/gen/apple -type d -maxdepth 6 2>/dev/null | head -50
            find . -name "*.app" -type d -maxdepth 10 2>/dev/null | head -20
            find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d -maxdepth 8 2>/dev/null | head -20
            exit 1
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: stradust-ios-${{ github.event.inputs.build_type || 'debug' }}
          path: stradust-ios/stradust-ios.ipa
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          echo "## 构建结果" >> $GITHUB_STEP_SUMMARY
          echo "- **构建类型**: ${{ github.event.inputs.build_type || 'debug' }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.build_type || 'debug' }}" = "debug" ]; then
            echo "- **签名**: 跳过签名（需 AltStore/Sideloadly 安装）" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **签名**: Apple Developer 签名" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **产物**: stradust-ios.ipa" >> $GITHUB_STEP_SUMMARY
