name: Build iOS IPA

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      build_type:
        description: "构建类型"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
  # 推送到 main 分支时自动构建
  push:
    branches: [main]
    paths:
      - "stradust-ios/**"

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "stradust-ios/src-tauri -> target"

      - name: Install frontend dependencies
        working-directory: stradust-ios
        run: pnpm install

      - name: Initialize Tauri iOS
        working-directory: stradust-ios
        run: |
          # 检查是否已初始化 iOS
          if [ ! -d "src-tauri/gen/apple" ]; then
            pnpm tauri ios init --ci
          fi

      - name: Build iOS (Debug)
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == '' }}
        working-directory: stradust-ios
        run: pnpm tauri ios build --debug

      - name: Build iOS (Release)
        if: ${{ github.event.inputs.build_type == 'release' }}
        working-directory: stradust-ios
        run: pnpm tauri ios build

      - name: Find and prepare IPA
        working-directory: stradust-ios
        run: |
          # 查找构建产物
          echo "=== 查找构建产物 ==="
          find src-tauri/gen/apple -name "*.app" -type d 2>/dev/null || true
          find src-tauri/target -name "*.app" -type d 2>/dev/null || true

          # 创建输出目录
          mkdir -p output

          # 查找 .app 文件并打包为 IPA
          APP_PATH=$(find src-tauri/target -name "星尘.app" -path "*/Release-iphoneos/*" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find src-tauri/target -name "星尘.app" -path "*/Debug-iphoneos/*" -type d 2>/dev/null | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find src-tauri/target -name "*.app" -path "*-iphoneos/*" -type d 2>/dev/null | head -1)
          fi

          if [ -n "$APP_PATH" ]; then
            echo "找到 APP: $APP_PATH"
            # 创建 IPA 结构
            mkdir -p output/Payload
            cp -r "$APP_PATH" output/Payload/
            cd output
            zip -r "../stradust-ios.ipa" Payload
            cd ..
            echo "IPA 创建成功: stradust-ios.ipa"
            ls -lh stradust-ios.ipa
          else
            echo "未找到 .app 文件，尝试从 Xcode 构建产物中查找..."
            # 尝试从 gen/apple 目录查找
            XC_PATH=$(find src-tauri/gen/apple -name "*.app" -type d 2>/dev/null | head -1)
            if [ -n "$XC_PATH" ]; then
              echo "找到 Xcode APP: $XC_PATH"
              mkdir -p output/Payload
              cp -r "$XC_PATH" output/Payload/
              cd output
              zip -r "../stradust-ios.ipa" Payload
              cd ..
              echo "IPA 创建成功: stradust-ios.ipa"
              ls -lh stradust-ios.ipa
            else
              echo "ERROR: 未找到任何 .app 构建产物"
              echo "=== 列出所有构建产物 ==="
              find src-tauri/target -name "*.app" -type d 2>/dev/null || echo "target 中无 .app"
              find src-tauri/gen/apple -name "*.app" -type d 2>/dev/null || echo "gen/apple 中无 .app"
              exit 1
            fi
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: stradust-ios-${{ github.event.inputs.build_type || 'debug' }}
          path: stradust-ios/stradust-ios.ipa
          retention-days: 30

      - name: Build summary
        run: |
          echo "## 构建结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **构建类型**: ${{ github.event.inputs.build_type || 'debug' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **产物**: stradust-ios.ipa" >> $GITHUB_STEP_SUMMARY
          echo "- **下载**: 在 Artifacts 中下载" >> $GITHUB_STEP_SUMMARY
