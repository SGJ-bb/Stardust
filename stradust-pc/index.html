<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星尘 Stradust</title>
  </head>

  <body>
    <div id="root"></div>
    <script>
    // 首帧前应用主题，避免明暗覆盖层闪烁
    try {
      var st = JSON.parse(localStorage.getItem("stradust-theme") || "{}");
      var settings = JSON.parse(localStorage.getItem("stradust-settings") || "{}");
      var dark = st.state ? !!st.state.darkMode : !!(settings.state && settings.state.settings && settings.state.settings.appearance && settings.state.settings.appearance.darkMode);
      var theme = (st.state && st.state.currentTheme) || (settings.state && settings.state.settings && settings.state.settings.appearance && settings.state.settings.appearance.theme) || "sakura";
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.setAttribute("data-theme-mode", dark ? "dark" : "light");
      if (dark) document.documentElement.classList.add("dark");
    } catch (e) {}
  </script>
  <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
